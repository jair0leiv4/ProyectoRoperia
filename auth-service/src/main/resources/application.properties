spring.application.name=auth-service
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3309/auth_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:demo}
spring.datasource.password=${DB_PASSWORD:Demo123!}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
server.error.include-message=always
server.error.include-binding-errors=never
# Valores por defecto SOLO para el laboratorio local (en Docker vienen del .env).
# El secreto JWT debe ser el MISMO en todos los microservicios.
app.jwt.secret=${JWT_SECRET:Q2xhdmVEZURlbW9QYXJhSmF2YU5vYmVDb25Eb2NrZXIyMDI2IQ==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:Admin1234}
